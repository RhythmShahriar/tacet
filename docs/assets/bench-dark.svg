<text x="431" y="160" text-anchor="end" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace' font-size="14" font-weight="500" fill="#A8A49C">-21%</text>
<text x="40" y="192" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15" font-weight="500" fill="#FFFFFF">rtk</text>
<rect x="495" y="177" width="135" height="22" rx="5" fill="#3A3833"/>
<text x="485" y="193" text-anchor="end" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace' font-size="14" font-weight="500" fill="#A8A49C">-15%</text>
<text x="40" y="225" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15" font-weight="500" fill="#FFFFFF">serena</text>
<rect x="531" y="210" width="99" height="22" rx="5" fill="#3A3833"/>
<text x="521" y="226" text-anchor="end" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace' font-size="14" font-weight="500" fill="#A8A49C">-11%</text>
<text x="40" y="258" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15" font-weight="500" fill="#FFFFFF">Concise style</text>
