<text x="530" y="259" text-anchor="end" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace' font-size="14" font-weight="500" fill="#A8A49C">-10%</text>
<text x="40" y="291" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15" font-weight="500" fill="#FFFFFF">context-mode</text>
