<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="t d">
<title id="t">Cost per run against Claude Code alone</title>
<desc id="d">Ten tasks, three runs each, Claude Code 2.1.314. tacet -40%, caveman -21%, rtk -15%, serena -11%, Concise style -10%, context-mode -6%, graphify -3%, claude-mem +11%.</desc>
<rect width="880" height="400" rx="18" fill="#100F0D"/>
<rect x=".5" y=".5" width="879" height="399" rx="18" fill="none" stroke="#2A2824"/>
<text x="40" y="48" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="18" font-weight="700" fill="#FFFFFF">Cost per run against Claude Code alone</text>
<text x="40" y="72" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" fill="#A8A49C">10 tasks, 3 runs each, Claude Code 2.1.314, every answer checked. Lower is better.</text>
<line x1="630" y1="96" x2="630" y2="356" stroke="#2A2824" stroke-width="2"/>
<text x="630" y="378" text-anchor="middle" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="12" fill="#A8A49C">Claude Code alone</text>
<text x="40" y="126" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15" font-weight="800" fill="#FFFFFF">tacet</text>
<rect x="270" y="111" width="360" height="22" rx="5" fill="#FF7C52"/>
<text x="260" y="127" text-anchor="end" font-family='ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace' font-size="14" font-weight="800" fill="#FF7C52">-40%</text>
<text x="40" y="159" font-family='ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15" font-weight="500" fill="#FFFFFF">caveman</text>
