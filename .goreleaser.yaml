# Archive names are a contract with install.sh, install.ps1 and
# tacet update: tacet_<os>_<arch>.tar.gz (.zip on Windows) plus checksums.txt.
version: 2
project_name: tacet

builds:
  - main: ./cmd/tacet
    binary: tacet
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Leaves out the GPL-licensed grammar scanners gotreesitter ships for
    # languages tacet doesn't index, so the binary stays MIT clean.
    tags: [gotreesitter_no_copyleft]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY/README.md
      - src: THIRD_PARTY/notices/*
        dst: THIRD_PARTY/notices
        strip_parent: true

checksum:
  name_template: checksums.txt

release:
  prerelease: auto

# Homebrew cask and Scoop manifest, pushed to their own repositories with
# TAP_GITHUB_TOKEN. Without the token (a fork, a local snapshot) GoReleaser
# still writes both files under dist/ but skips the push.
homebrew_casks:
  - name: tacet
    binaries: [tacet]
    repository:
      owner: RhythmShahriar
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/RhythmShahriar/tacet
    description: Makes Claude Code use fewer tokens on any project
    license: MIT
    commit_author:
      name: Rhythm Shahriar
      email: me@rhy.io
    commit_msg_template: "tacet {{ .Tag }}"
    skip_upload: '{{ if not (index .Env "TAP_GITHUB_TOKEN") }}true{{ end }}'
    caveats: |
      Run tacet init in a project to measure it and install the Claude Code plugin.
    # The binary is signed through Sigstore, not notarized by Apple, so
    # Gatekeeper would block it on first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tacet"]
          end

scoops:
  - name: tacet
    repository:
      owner: RhythmShahriar
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/RhythmShahriar/tacet
    description: Makes Claude Code use fewer tokens on any project
    license: MIT
    commit_author:
      name: Rhythm Shahriar
      email: me@rhy.io
    commit_msg_template: "tacet {{ .Tag }}"
    skip_upload: '{{ if not (index .Env "TAP_GITHUB_TOKEN") }}true{{ end }}'

# Keyless Sigstore signature over checksums.txt. Verify with
# scripts/verify-release.sh, which runs:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity https://github.com/RhythmShahriar/.github/.github/workflows/release-go.yml@refs/heads/master \
#     --certificate-github-workflow-repository RhythmShahriar/tacet checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

changelog:
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude: ['^(docs|test|ci|chore|style)(\(.+\))?!?:']
