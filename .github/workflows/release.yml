name: release
on:
  push:
    tags: ["v*"]
# Called at master, not pinned by commit: tacet update only accepts a
# release signed by release-go.yml@refs/heads/master.
jobs:
  release:
    uses: RhythmShahriar/.github/.github/workflows/release-go.yml@master
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Pushes the Homebrew cask and Scoop manifest; without it GoReleaser
    # skips both.
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
