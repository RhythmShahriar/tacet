# Publishes tacet to npm after a release as one package, @rhythmsh/tacet.
# It holds no binary: on first run its launcher downloads this platform's
# archive from the release and checks it against the SHA-256 recorded in
# package.json here, after checksums.txt verifies against the release
# workflow's attestation and every archive against checksums.txt.
#
# It uses the NPM_TOKEN repository secret (an npm granular token with write
# access) when there is one. Without it, npm publishes through Trusted
# Publishing (OIDC, npm 11.5.1 or later), once the package is linked to this
# workflow on npmjs.com; then delete the secret.
#
# A release GoReleaser publishes with GITHUB_TOKEN fires no release event in
# other workflows, so the release workflow finishing starts this one too.
# Both may run for one tag; the concurrency group and the skip for versions
# already on npm make that safe.
name: npm
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.0.
        required: true
        type: string
permissions:
  contents: read
  id-token: write   # npm provenance and Trusted Publishing
  attestations: read  # gh attestation verify
env:
  TAG: ${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
  # No package script runs in the job that can publish.
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
concurrency:
  group: npm-${{ github.event.workflow_run.head_branch || github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        run: printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern checksums.txt --pattern 'tacet_*.tar.gz' --pattern 'tacet_*.zip'
      # --source-ref: a snapshot dry run from a branch is attested by the
      # same workflow, so only a file built from this tag may pass.
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify release/checksums.txt --repo RhythmShahriar/tacet \
            --signer-workflow RhythmShahriar/.github/.github/workflows/release-go.yml \
            --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
      - name: Build the packages
        run: scripts/npm-pack.sh "$TAG" release npm/out
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=${TAG#v}
          tag=latest
          case "$TAG" in *-*) tag=next ;; esac   # v1.2.0-rc1 → next, never latest
          # setup-node points .npmrc at NODE_AUTH_TOKEN. Set it only from a
          # real secret: an empty or placeholder token would stop npm from
          # falling back to Trusted Publishing.
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN=$NPM_TOKEN
          else
            unset NODE_AUTH_TOKEN
            echo "No NPM_TOKEN secret: publishing with Trusted Publishing."
          fi
          # A rerun skips a version that is already out.
          for dir in npm/out/tacet/; do
            name=$(node -p "require('./${dir}package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public --tag "$tag")
          done
          # 1.2.0 shipped six platform packages; tacet is one package now.
          # Mark them and npm's staging placeholder as no longer used.
          # Runs once: a package that already says so is left alone.
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            name=@rhythmsh/tacet-$p
            if [ -z "$(npm view "$name" deprecated 2>/dev/null)" ]; then
              npm deprecate "$name" "No longer used: tacet ships as one package. Install @rhythmsh/tacet." || true
            fi
          done
          if [ -z "$(npm view @rhythmsh/tacet@0.0.0-stage deprecated 2>/dev/null)" ]; then
            npm deprecate "@rhythmsh/tacet@0.0.0-stage" "Placeholder npm made while publishing; install @rhythmsh/tacet." || true
          fi
